<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません | Pourly</title>
<meta name="description" content="">
<link rel="icon" href="/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#FBF8F4;--surface:#FFFFFF;--alt:#F4EEE6;--line:#E8E0D6;--text:#2B1D14;--sub:#7A6A5C;--primary:#4A2C1E;--accent:#C47A45}
@media (prefers-color-scheme:dark){:root{--bg:#15110F;--surface:#221B18;--alt:#2C2420;--line:#3A302A;--text:#F3ECE4;--sub:#A39588;--primary:#E1A16A;--accent:#C47A45}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;font-size:16px;line-height:1.8}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line);background:var(--surface)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
header a.brand{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:700;font-size:18px}
header img{width:28px;height:28px;border-radius:6px}
main{padding:24px 0 48px}
h1{font-size:24px;line-height:1.4;margin:8px 0 20px}
h3{font-size:17px;margin:32px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
p,li{overflow-wrap:anywhere}
ol,ul{padding-left:1.5em}
a{color:var(--primary)}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--alt)}
.meta{margin-top:32px;padding:14px 16px;background:var(--alt);border-radius:10px;font-size:14px;color:var(--sub)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0}
.btn{display:inline-block;background:var(--primary);color:var(--bg);text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:700}
footer{border-top:1px solid var(--line);padding:20px 0 32px;font-size:14px;color:var(--sub)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:10px}
footer nav a{color:var(--sub)}
footer nav a[aria-current]{color:var(--text);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><img src="/apple-touch-icon.png" alt="">Pourly</a></div></header>
<main><div class="wrap">
<div id="r" hidden>
<h1>Pourly のレシピ</h1>
<p>このレシピは Pourly アプリで見られます。</p>
<div class="card"><p style="margin:0" id="r-msg">iPhone 版を準備中です。公開までもう少しお待ちください。</p></div>
</div>
<div id="nf">
<h1>ページが見つかりません</h1>
<p><a href="/">トップページへ</a></p>
</div>
<script>
// 共有 URL /r/<レシピID> の受け口。App Store 公開後に APP_STORE_URL を入れると自動で転送する。
var APP_STORE_URL = '';
if (/^\/r\/[^/]+\/?$/.test(location.pathname)) {
  document.getElementById('r').hidden = false;
  document.getElementById('nf').hidden = true;
  document.title = 'Pourly のレシピ';
  if (APP_STORE_URL) { location.replace(APP_STORE_URL); }
}
</script>

</div></main>
<footer><div class="wrap"><nav><a href="/terms.html">利用規約</a><a href="/privacy.html">プライバシーポリシー</a><a href="/delete-account.html">アカウント削除</a><a href="/support.html">サポート</a></nav>© Asthiro</div></footer>
</body>
</html>
